<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strange Attractor Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="panel">
    <h1>Attractor Forge</h1>

    <label class="row">
      <span>Preset</span>
      <select id="preset"></select>
    </label>

    <div class="sliders">
      <label><span>Scale</span><input type="range" id="scale" min="2" max="400" value="120"></label>
      <label><span>Speed</span><input type="range" id="speed" min="1" max="200" value="60"></label>
      <label><span>Fade</span><input type="range" id="fade" min="0" max="20" value="4"></label>
      <label><span>Hue speed</span><input type="range" id="hue" min="0" max="40" value="8"></label>
    </div>

    <div class="params" id="params"></div>

    <div class="buttons">
      <button id="randomize">Randomize</button>
      <button id="reseed">Reseed</button>
      <button id="export">Export PNG</button>
      <button id="copy">Copy link</button>
    </div>

    <div class="foot">
      <span id="info"></span>
    </div>
  </div>
</div>
<script src="presets.js"></script>
<script src="main.js"></script>
</body>
</html>
